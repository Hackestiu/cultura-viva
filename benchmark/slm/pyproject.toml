    "langchain-huggingface>=0.3.1",
    "langchain-ollama>=0.3.10",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.1",
    "ragas>=0.4.3",
    "sentence-transformers>=5.6.0",
]
