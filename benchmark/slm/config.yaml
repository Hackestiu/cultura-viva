# ==============================================================================
# CulturaViva & SLM-Benchmark Unified Configuration
# ==============================================================================

# Candidate Small Language Models (SLMs) evaluated on PC & deployed to Arduino
candidates:
  - name: "Qwen2.5-1.5B-Instruct"
    ollama_tag: "qwen2.5:1.5b"
    gguf_repo: "Qwen/Qwen2.5-1.5B-Instruct-GGUF"
    gguf_file: "qwen2.5-1.5b-instruct-q4_k_m.gguf"
    gguf_url: "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"

  - name: "Llama-3.2-1B-Instruct"
    ollama_tag: "llama3.2:1b"
    gguf_repo: "bartowski/Llama-3.2-1B-Instruct-GGUF"
    gguf_file: "Llama-3.2-1B-Instruct-Q4_K_M.gguf"
    gguf_url: "https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.gguf"

  - name: "SmolLM2-1.7B-Instruct"
    ollama_tag: "smollm2:1.7b"
    gguf_repo: "HuggingFaceTB/SmolLM2-1.7B-Instruct-GGUF"
    gguf_file: "smollm2-1.7b-instruct-q4_k_m.gguf"
    gguf_url: "https://huggingface.co/HuggingFaceTB/SmolLM2-1.7B-Instruct-GGUF/resolve/main/smollm2-1.7b-instruct-q4_k_m.gguf"

  - name: "Qwen2.5-0.5B-Instruct"
    ollama_tag: "qwen2.5:0.5b"
    gguf_repo: "Qwen/Qwen2.5-0.5B-Instruct-GGUF"
    gguf_file: "qwen2.5-0.5b-instruct-q4_k_m.gguf"
    gguf_url: "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"

  - name: "Gemma-3-1B-IT"
    ollama_tag: "gemma3:1b"
    gguf_repo: "bartowski/google_gemma-3-1b-it-GGUF"
    gguf_file: "google_gemma-3-1b-it-Q4_K_M.gguf"
    gguf_url: "https://huggingface.co/bartowski/google_gemma-3-1b-it-GGUF/resolve/main/google_gemma-3-1b-it-Q4_K_M.gguf"

# Endpoint serving the candidate models under test. Kept separate from the
# judge's: the two are the same Ollama instance today, but scoring a model with
# itself is exactly the mistake this split is here to prevent.
ollama:
  base_url: "http://localhost:11434"

# Evaluation Judge (Ragas)
judge:
  model: "qwen2.5:7b"
  base_url: "http://localhost:11434"
  temperature: 0.0

# Sentence Embeddings for Ragas Judge
embeddings:
  model: "sentence-transformers/all-MiniLM-L6-v2"

# Workspace Paths (relative to repository root)
paths:
  # Read the device's knowledge files directly rather than keeping a copy here.
  # The copies drifted twice: once by 12 element sheets, and again when the sheets
  # were translated into English, each time leaving the benchmark grounding answers
  # in text the device no longer serves. Same argument as core/device_prompt.py
  # makes for the prompts -- import the real thing, do not duplicate it.
  knowledge_base: "../../arduino/python/models/knowledge/knowledge_base.json"
  element_sheets: "../../arduino/python/models/knowledge/element_sheets.json"
  testset: "eval/testset.json"
  models_dir: "models"
  arduino_export_dir: "arduino_export"
  eval_dir: "eval"
  results_dir: "eval/results"

# Generation parameters. These mirror the values the device passes to
# create_chat_completion in arduino/python/core/model_module.py -- if that
# changes, change it here too, or the benchmark stops describing what ships.
inference:
  temperature: 0.1
  max_tokens: 60            # device: max_tokens=60
  repeat_penalty: 1.1       # device: repeat_penalty=1.1
  stop:                     # device: stop=["\n\n", "<|im_end|>"]
    - "\n\n"
    - "<|im_end|>"
  seed: 0                   # fixed so a rerun reproduces; Ollama randomises otherwise
  context_window: 2048
  threads: 4
  batch_size: 256

  # Guide voices to benchmark. Names must exist in PERSONALITY_PROMPTS in
  # arduino/python/core/model_module.py; each produces its own predictions file.
  personalities:
    - artistic
    - technical
    - child

# Passages pulled from the knowledge base per question. The device instead looks
# an element up directly by the id vision gives it; the testset has no element
# ids and includes architect-level and cross-monument questions, so retrieval
# stays semantic here.
retrieval:
  top_k: 3

# Arduino UNO Q Deployment Defaults
arduino:
  default_model: "qwen2.5:1.5b"
  compiler_flags: "-march=armv8-a -mtune=cortex-a53"
