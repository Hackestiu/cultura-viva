# When true, speech/*.py use lightweight mock backends (see the models/
# package) instead of loading real Whisper/Qwen/Piper models. Flip to false
# once real model files are available at the paths below.
mock: true

models:
  stt_path: ./models/stt/ggml-small.en.bin
  slm_path: ./models/qwen2.5-1.5b-instruct-q4_k_m.gguf
  tts_path: ./models/tts/en_US-lessac-medium.onnx

output:
  wav_path: audios/output/output.wav
