[project]
name = "cultura-viva"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.1.0",
    "datasets>=5.0.1",
    "evaluate>=0.4.6",
    "pillow>=12.3.0",
    "piper-tts>=1.6.0",
    "pywhispercpp>=1.5.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
    "wandb>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
