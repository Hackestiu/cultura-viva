[project]
name = "tts-benchmark"
version = "0.1.0"
description = "TTS inference-time benchmark for small open-source models on the Arduino UNO Q"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy<2",
    "soundfile",
]

[project.optional-dependencies]
# Only needed to actually run models (benchmark.py, on the board itself).
# Kept out of the base install so generating/viewing the report (simulate.py
# + visualize.py) never has to pull down PyTorch.
real = [
    "torch>=2.1,<=2.3.1",
    "transformers>=4.35,<4.45",
    "huggingface-hub",
    "datasets",
    "phonemizer",
    "sentencepiece",
]

[tool.uv]
package = false

[dependency-groups]
real = [
    "huggingface-hub>=0.36.2",
    "onnxruntime>=1.24.3",
    "optimum-onnx>=0.1.0",
    "phonemizer>=3.4.0",
    "piper-tts>=1.7.0",
]
