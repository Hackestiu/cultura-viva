[project]
name = "cultura-viva-uno-q"
version = "2.0.0"
description = "Guia turístic multimodal amb IA per a Arduino UNO Q (STT, SLM, TTS i Visió)"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "onnxruntime>=1.16.0",
    "pillow>=10.0.0",
    "faster-whisper>=1.0.0",
    "llama-cpp-python>=0.2.0",
    "piper-tts>=1.2.0",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "huggingface-hub>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# uv config
dev-dependencies = [
    "pytest>=8.0.0",
]
